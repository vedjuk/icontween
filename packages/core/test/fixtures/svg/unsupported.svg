<svg xmlns="http://www.w3.org/2000/svg" xmlns:xlink="http://www.w3.org/1999/xlink" viewBox="0 0 24 24">
  <!-- The kind of export a design tool makes: defs with a gradient and a clip, a style block. -->
  <defs>
    <linearGradient id="g"><stop offset="0" stop-color="red"/><stop offset="1" stop-color="blue"/></linearGradient>
    <clipPath id="c"><rect width="24" height="24"/></clipPath>
    <symbol id="s"><path d="M0 0 L4 4"/></symbol>
  </defs>
  <style>.a { stroke: red; }</style>
  <g clip-path="url(#c)">
    <path class="a" d="M2 2 L22 22" stroke="black" stroke-dasharray="2 2" stroke-opacity="0.5"/>
    <rect x="4" y="4" width="6" height="6" fill="url(#g)"/>
  </g>
  <use xlink:href="#s"/>
  <use xlink:href="#s"/>
  <text x="2" y="20">Hi<tspan>!</tspan></text>
</svg>
