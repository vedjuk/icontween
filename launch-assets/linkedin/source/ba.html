<!doctype html>
<html>
  <head>
    <meta charset="utf-8" />
    <style>
      :root {
        --bg: #fbfbfa;
        --fg: #18181b;
        --muted: #67676f;
        --accent: #d9432a;
        --border: #e4e4e7;
        font-family:
          ui-sans-serif,
          system-ui,
          -apple-system,
          sans-serif;
        -webkit-font-smoothing: antialiased;
        color: var(--fg);
      }
      html,
      body {
        margin: 0;
        width: 1200px;
        height: 420px;
        background: var(--bg);
      }
      .wrap {
        padding: 60px 124px;
      }
      .row {
        display: flex;
        align-items: center;
        gap: 18px;
      }
      .tile {
        width: 176px;
        height: 176px;
        border: 1.5px solid var(--border);
        border-radius: 24px;
        background: #fff;
        display: grid;
        place-items: center;
      }
      .tile.mid {
        background: transparent;
        border-style: dashed;
      }
      .tile svg {
        width: 96px;
        height: 96px;
      }
      .arrow {
        color: #b4b4bb;
        font-size: 28px;
      }
      .labels {
        display: flex;
        gap: 18px;
        margin-top: 22px;
      }
      .labels div {
        width: 176px;
        text-align: center;
        font-size: 20px;
        color: var(--muted);
      }
      .labels b {
        color: var(--fg);
        font-weight: 600;
      }
      .bar {
        margin: 34px 0 0 calc(176px + 18px);
        width: calc(176px * 3 + 18px * 2);
        border-top: 2px solid var(--accent);
        position: relative;
        text-align: center;
      }
      .bar span {
        position: relative;
        top: -14px;
        background: var(--bg);
        padding: 0 12px;
        font-size: 20px;
        color: var(--accent);
        font-weight: 600;
      }
      h2 {
        margin: 0 0 34px;
        font-size: 30px;
        letter-spacing: -0.01em;
        font-weight: 600;
      }
      h2 small {
        font-weight: 400;
        color: var(--muted);
        font-size: 22px;
        margin-left: 12px;
      }
    </style>
  </head>
  <body>
    <div class="wrap">
      <h2>menu → close<small>Lucide's menu icon, animated with IconTween</small></h2>
      <div class="row" id="row"></div>
      <div class="labels">
        <div><b>Before</b> · state A</div>
        <div></div>
        <div>in-betweens</div>
        <div></div>
        <div><b>After</b> · state B</div>
      </div>
    </div>
    <script>
      window.build = (svg, times) => {
        const r = document.getElementById('row');
        times.forEach((t, i) => {
          const d = document.createElement('div');
          d.className = 'tile' + (i > 0 && i < times.length - 1 ? ' mid' : '');
          d.innerHTML = svg
            .replace(/menuPlay/g, 'menuPlay' + i)
            .replace(/menuReverse/g, 'menuReverse' + i);
          r.appendChild(d);
        });
        [...document.querySelectorAll('.tile svg')].forEach((s, i) => {
          s.pauseAnimations();
          s.setCurrentTime(times[i]);
        });
      };
    </script>
  </body>
</html>
